<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NexaRack Console</title><style>body{margin:0;background:#08111e;color:#e8f0fb;font:15px system-ui;padding:24px}main{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#122238;border:1px solid #263c55;border-radius:12px;padding:16px}button{background:#12658b;color:white;border:0;border-radius:8px;padding:10px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#9bc5df}small{color:#94a9c1}</style></head><body><main><h1>NexaRack <small>AI Infrastructure Simulation Console</small></h1><p>Blackwell-inspired logical rack · simulation only</p><div class="grid"><div class="card"><small>Logical GPUs</small><h2 id="gpus">—</h2></div><div class="card"><small>GPU utilization</small><h2 id="util">—</h2></div><div class="card"><small>Rack power</small><h2 id="power">—</h2></div><div class="card"><small>Temperature estimate</small><h2 id="temp">—</h2></div></div><h2>Submit workload</h2><select id="kind"><option>matrix</option><option>llm-inference</option><option>distributed-training</option><option>memory-bandwidth</option></select> GPUs <input id="count" type="number" min="1" max="72" value="8"><button id="submit">Queue workload</button> <button id="tick">Advance 1 second</button><p id="status"></p><h2>Jobs</h2><pre id="jobs">Loading…</pre><h2>Telemetry</h2><pre id="metrics"></pre><script>async function req(p,o){let r=await fetch(p,{headers:{'Content-Type':'application/json'},...o});if(!r.ok)throw Error(await r.text());return r.json()}async function refresh(){try{let i=await req('/inventory'),m=await req('/metrics'),j=await req('/workloads');gpus.textContent=i.gpu_count;util.textContent=((m.gpu_utilization_avg||0)*100).toFixed(1)+'%';power.textContent=(((m.power||{}).rack_power_w||0)/1000).toFixed(1)+' kW';temp.textContent=(((m.power||{}).rack_temperature_c)||22).toFixed(1)+' °C';jobs.textContent=JSON.stringify(j.jobs,null,2);metrics.textContent=JSON.stringify(m,null,2);status.textContent='API connected'}catch(e){status.textContent='Start API: uvicorn nexarack.api:app --reload'}}submit.onclick=async()=>{try{let j=await req('/workloads',{method:'POST',body:JSON.stringify({kind:kind.value,gpu_count:Number(count.value)})});status.textContent='Queued '+j.id;refresh()}catch(e){status.textContent=e.message}};tick.onclick=async()=>{try{await req('/tick?seconds=1',{method:'POST'});refresh()}catch(e){status.textContent=e.message}};refresh();setInterval(refresh,3000)</script></main></body></html>
